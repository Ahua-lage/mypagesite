name: Daily rebuild

on:
    push:
        branches:
            - never-trigger-this-workflow

jobs:
    rebuild:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Coolify deploy
              run: |
                  curl -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
                    -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
