# 注意：此文件需要放置在你的 preson-obsidian 仓库中！
# 路径：preson-obsidian/.github/workflows/generate-garden.yml
# 不要放在 personal-website-main 仓库中

name: Generate Garden JSON

on:
    push:
        branches:
            - main
        paths:
            - "**.md"
    workflow_dispatch:

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install

            - name: Generate garden JSON
              run: node scripts/generate-garden-json.js . ./output/digital-garden.json

            - name: Commit and push if changed
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add -A
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore: auto-update digital-garden.json"
                    git push
                  fi